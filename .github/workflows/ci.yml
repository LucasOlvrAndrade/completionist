name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Inclui a conferência de que messages/pt-BR.json e messages/en.json têm as mesmas chaves.
      - run: pnpm test
      - run: pnpm build
        env:
          CI_BUILD: '1'
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
